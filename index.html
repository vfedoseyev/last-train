<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Последний поезд</title>
    <meta name="description" content="Не было злодея. Не было убийцы. Браузерная point-and-click игра о школьнике Артёме и тайне старого северного посёлка." />

    <!-- Open Graph — превью при шаринге ссылки в мессенджерах/соцсетях. Абсолютный
         URL (не /og-image.jpg) — часть крауlеров не резолвит относительные пути
         правильно, а домен GitHub Pages для этого репозитория уже известен и не
         изменится. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vfedoseyev.github.io/last-train/" />
    <meta property="og:title" content="Последний поезд" />
    <meta property="og:description" content="Не было злодея. Не было убийцы. Браузерная point-and-click игра о школьнике Артёме и тайне старого северного посёлка." />
    <meta property="og:image" content="https://vfedoseyev.github.io/last-train/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X карточка — отдельный набор тегов, OG он не читает -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Последний поезд" />
    <meta name="twitter:description" content="Не было злодея. Не было убийцы." />
    <meta name="twitter:image" content="https://vfedoseyev.github.io/last-train/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
